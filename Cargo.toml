[package]
name = "mcp-yocto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fern = "0.7.1"
log = "0.4"
rmcp = { version = "3.4.0", features = ["transport-io", "schemars", "server", "macros"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "fs"] }
toml = "0.8"
